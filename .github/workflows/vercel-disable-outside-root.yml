name: Vercel — 루트 외부 파일 포함 끄기

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: PATCH Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node brainstorming-techniques-presentation/scripts/vercel-disable-outside-root.mjs
